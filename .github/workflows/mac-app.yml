name: Mac app

# Builds Synclassic.app and a .dmg on GitHub's Macs: by hand (Actions → Mac app → Run workflow),
# or for every version tag (git tag v1.0 && git push --tags), which also makes a release with it.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: packaging/build_mac_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Synclassic-dmg
          path: dist/*.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
