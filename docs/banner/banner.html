<!doctype html>
<!--
  The README banner (docs/banner.png): the app window with the iPod in front, on a transparent
  background.

  Edit this file, preview it by opening it in a browser, then make the PNG:

      python docs/banner/render.py

  The banner's size is in the "banner-size" line below (saved at 2x). Positions and sizes are the
  variables right under <style>. The images sit next to this file: window.png (a screenshot of
  the app) and ipod.png. Swap them for new ones with the same names.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="banner-size" content="840x560">
<title>Synclassic banner</title>
<style>
:root {
  /* --- easy to change ------------------------------------------------------------------ */
  --width: 840px;  --height: 560px;   /* keep in step with "banner-size" above */
  --window-left: 110px;  --window-top: 20px;   --window-width: 690px;
  --ipod-left: 38px;     --ipod-top: 228px;    --ipod-width: 176px;  --ipod-tilt: -7deg;
}

@font-face { font-family: "Banner"; font-weight: 600; src: url("fonts/Inter-SemiBold.woff2") format("woff2"); }

/* For the PDF route of render.py: one page, exactly the banner. */
@page { size: 840px 560px; margin: 0; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--width); height: var(--height); overflow: hidden; background: transparent; }
body { position: relative; font-family: "Banner", -apple-system, "Helvetica Neue", sans-serif;
       -webkit-font-smoothing: antialiased; }

/* The app window, with a macOS title bar. */
.window {
  position: absolute; left: var(--window-left); top: var(--window-top); width: var(--window-width);
  border-radius: 11px; overflow: hidden; background: #e3e3e3;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .22), 0 24px 50px rgba(25, 45, 80, .30), 0 6px 14px rgba(25, 45, 80, .16);
}
.titlebar { position: relative; height: 21px; display: flex; align-items: center;
            background: linear-gradient(180deg, #ececec, #e3e3e3); }
.lights { display: flex; gap: 6px; margin-left: 9px; }
.lights i { display: block; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .25); }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.titlebar span { position: absolute; left: 0; right: 0; text-align: center; font-size: 11px; font-weight: 600; color: #3a3a3a; }
.window img { display: block; width: 100%; }

/* The iPod in front. */
.ipod {
  position: absolute; left: var(--ipod-left); top: var(--ipod-top); width: var(--ipod-width);
  transform: rotate(var(--ipod-tilt));
  filter: drop-shadow(0 18px 18px rgba(10, 20, 40, .34)) drop-shadow(0 4px 6px rgba(10, 20, 40, .22));
}
</style>
</head>
<body>

<div class="window">
  <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><span>Synclassic</span></div>
  <img src="window.png" alt="">
</div>

<img class="ipod" src="ipod.png" alt="">

</body>
</html>
